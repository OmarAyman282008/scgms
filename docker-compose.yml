# docker compose up -d --build      → http://SERVER (port 80)
# Settings come from the .env file (copy .env.example to .env first).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scgms}
      POSTGRES_USER: ${POSTGRES_USER:-scgms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scgms}"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-scgms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-scgms}
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /app/data/media
      RUN_BOOTSTRAP: "1"
    volumes:
      - media:/app/data/media
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-scgms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-scgms}
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /app/data/media
      RUN_BOOTSTRAP: "0"
    command: celery -A config worker -l info --concurrency 2
    volumes:
      - media:/app/data/media
    depends_on: [web]

  beat:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-scgms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-scgms}
      REDIS_URL: redis://redis:6379/0
      RUN_BOOTSTRAP: "0"
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    depends_on: [web]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [web]

volumes:
  pgdata:
  media:
