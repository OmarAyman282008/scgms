# Reverse proxy in front of gunicorn. Static files are served by whitenoise;
# uploaded governance documents are NEVER exposed directly — they are streamed
# by the application after a permission check.
upstream scgms_web { server web:8000; }

server {
    listen 80;
    server_name _;
    client_max_body_size 30m;

    # For HTTPS, terminate TLS here (see docs/DEPLOYMENT.md) and redirect port 80.

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location / {
        proxy_pass http://scgms_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
