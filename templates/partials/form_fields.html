{% for field in form %}
<div class="mb-3 {% if field.field.widget.input_type == 'checkbox' %}form-check{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' %}
    <input type="checkbox" class="form-check-input" name="{{ field.html_name }}" id="{{ field.auto_id }}" {% if field.value %}checked{% endif %}>
    <label class="form-check-label" for="{{ field.auto_id }}">{{ field.label }}</label>
  {% else %}
    <label class="form-label" for="{{ field.auto_id }}">{{ field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
  {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
</div>
{% endfor %}
